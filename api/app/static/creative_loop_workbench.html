<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative Loop 工作台</title>
<style>body{font:14px system-ui;background:#071225;color:#e7eefc;margin:0;padding:24px}button,input,textarea{padding:8px;border-radius:6px;border:1px solid #45638d;background:#102545;color:#fff}button{cursor:pointer}.primary{background:#2d79d8}.danger{background:#712d42}.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:16px}.card,.status,.job{background:#102545;border:1px solid #294365;border-radius:10px;padding:16px}.status-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.status span{display:block;color:#abc0de;margin-top:4px}.status.ok{border-color:#4bd39a}.status.bad{border-color:#e66e82}.fields{display:grid;gap:10px;margin:12px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.job{margin-bottom:12px}.head,.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.bar{height:6px;background:#08182e}.bar i{display:block;height:100%;background:#4d9cff}.item{border-top:1px solid #294365;margin-top:10px;padding-top:8px}.item video{width:100%;max-width:420px}.sub{color:#abc0de}.toast{position:fixed;right:18px;bottom:18px;background:#091a32;border:1px solid #4b6f9d;padding:12px;opacity:0}.toast.show{opacity:1}.toast.err{border-color:#e66e82}.dialog{position:fixed;inset:0;background:#000b;display:grid;place-items:center}.dialog>div{background:#102545;padding:20px;border:1px solid #e66e82;border-radius:10px;width:min(460px,90%)}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.status-row{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.two,.status-row{grid-template-columns:1fr}}</style>
<main><header class="head"><div><h1>Creative Loop 工作台</h1><p class="sub">创建任务、查看处理进度并审核成片。</p></div><div><button id="login">启动 Insight 登录</button> <button id="refresh" class="primary">刷新</button></div></header><section class="status-row"><div id="engine" class="status">Creative Loop<span>连接中…</span></div><div id="insight" class="status">Insight<span>检查中…</span></div><div id="brand" class="status">品牌资产<span>检查中…</span></div><div id="mtg" class="status">Mintegral<span>检查中…</span></div></section><section class="grid"><article class="card"><h2>新建任务</h2><button id="searchTab" class="primary">关键词搜索</button> <button id="urlTab">详情页链接</button><form id="form"><div id="searchFields" class="fields"><input id="keyword" placeholder="搜索词"><div class="two"><input id="start" type="date"><input id="end" type="date"></div><input id="count" type="number" min="1" max="100" value="10"></div><div id="urlFields" class="fields hidden"><textarea id="urls" placeholder="每行一个详情页链接，支持多条"></textarea></div><button class="primary">开始自动处理</button></form></article><article class="card"><h2>任务与审核</h2><p id="countLabel" class="sub"></p><div id="jobs"></div></article></section></main><div id="toast" class="toast"></div><div id="dialog" class="dialog hidden"><div><h3>删除任务记录</h3><p class="sub">仅删除任务记录，媒体文件保留。</p><p id="taskId"></p><input id="confirm"><p><button id="cancel">取消</button> <button id="remove" class="danger" disabled>确认删除</button></p></div></div>
<script>(()=>{const A='/agent/v1',S={mode:'search',id:null},$=x=>document.getElementById(x),toast=(m,e=false)=>{const n=$('toast');n.textContent=m;n.className='toast show'+(e?' err':'');clearTimeout(n.t);n.t=setTimeout(()=>n.className='toast',4500)},req=async(p,o={})=>{const r=await fetch(A+p,{headers:{'Content-Type':'application/json'},...o}),b=await r.json().catch(()=>({}));if(!r.ok||b.ok===false){const d=typeof b.detail==='object'?(b.detail.error||b.detail.message):b.detail;throw Error(d||b.message||'请求失败')}return b},label={QUEUED:'等待处理',CRAWLING:'采集中',PROCESSING:'处理中',UPLOADING:'上传中',AWAITING_REVIEW:'待审核',COMPLETED:'已完成',FAILED:'失败',CANCELLED:'已取消',CANCEL_REQUESTED:'取消中'};
function render(xs){$('countLabel').textContent=`共 ${xs.length} 个任务`;$('jobs').innerHTML=xs.map(j=>{const p=j.progress||{},pc=Math.max(0,Math.min(100,Number(p.overall_percent||0))),active=['QUEUED','CRAWLING','PROCESSING','UPLOADING','CANCEL_REQUESTED'].includes(j.status),review=j.status==='AWAITING_REVIEW';let a='';if(review)a+=`<button data-a="approve" data-id="${j.task_id}">通过</button> <button data-a="reject" data-id="${j.task_id}">拒绝</button> `;if(active)a+=`<button class="danger" data-a="cancel" data-id="${j.task_id}">取消</button> `;if(!active)a+=`<button class="danger" data-a="delete" data-id="${j.task_id}">删除记录</button>`;return `<section class="job"><div class="head"><strong>${j.mode==='search'?(j.summary?.keyword||j.task_id):'详情页任务'}</strong><span>${label[j.status]||j.status}</span></div><p class="sub">${j.task_id} · ${j.stage_label||''}</p><div class="bar"><i style="width:${pc}%"></i></div><p class="row sub"><span>已下载 ${p.downloaded_count||0} · 已处理 ${p.processed_count||0}</span><span>${pc}%</span></p><div>${a}</div>${(j.items||[]).map(i=>`<div class="item"><div class="row"><span>${i.item_id||'素材'}</span><span>${label[i.status]||i.status||''}</span></div>${i.preview_url?`<video controls preload="metadata" src="${i.preview_url}"></video>`:''}</div>`).join('')}</section>`}).join('')||'<p class="sub">当前没有任务。</p>'}
async function refresh(){try{const[h,j]=await Promise.all([req('/health'),req('/jobs?limit=30')]);[['engine',h.operator_ready,'已就绪','未就绪'],['insight',h.insight_logged_in,'已登录','需要登录'],['brand',h.brand_assets_ready,'已就绪','未就绪'],['mtg',h.mintegral_ready,'已就绪','未就绪']].forEach(x=>{$(x[0]).classList.toggle('ok',!!x[1]);$(x[0]).classList.toggle('bad',!x[1]);$(x[0]).querySelector('span').textContent=x[1]?x[2]:x[3]});render(j.items||[])}catch(e){toast('刷新失败：'+e.message,true)}}
function mode(m){S.mode=m;$('searchFields').classList.toggle('hidden',m!=='search');$('urlFields').classList.toggle('hidden',m==='search');$('searchTab').classList.toggle('primary',m==='search');$('urlTab').classList.toggle('primary',m==='url')}
$('searchTab').onclick=()=>mode('search');$('urlTab').onclick=()=>mode('url');$('form').onsubmit=async e=>{e.preventDefault();const p={idempotency_key:'floatboat-'+Date.now(),mode:S.mode,wait_for_review:true,auto_upload:false};if(S.mode==='search'){p.keyword=$('keyword').value.trim();p.search_date_start=$('start').value;p.search_date_end=$('end').value;p.download_count=Number($('count').value)}else p.detail_urls=$('urls').value.split(/[\s,;]+/).filter(Boolean);try{const j=await req('/jobs',{method:'POST',body:JSON.stringify(p)});toast('任务 '+j.task_id+' 已创建');refresh()}catch(e){toast('创建失败：'+e.message,true)}};
function close(){S.id=null;$('dialog').classList.add('hidden')};$('cancel').onclick=close;$('confirm').oninput=()=>{$('remove').disabled=$('confirm').value.trim()!==S.id};$('remove').onclick=async()=>{try{const r=await req('/jobs/'+encodeURIComponent(S.id)+'/delete',{method:'POST',body:JSON.stringify({confirm_task_id:S.id})});close();toast(r.message||'任务记录已删除，媒体文件保持不变。');refresh()}catch(e){toast('删除失败：'+e.message,true)}};$('jobs').onclick=e=>{const b=e.target.closest('button[data-a]');if(!b)return;const id=b.dataset.id,a=b.dataset.a;if(a==='delete'){S.id=id;$('taskId').textContent=id;$('confirm').value='';$('remove').disabled=true;$('dialog').classList.remove('hidden')}else if(a==='cancel')req('/jobs/'+encodeURIComponent(id)+'/cancel',{method:'POST',body:JSON.stringify({reason:'workbench_cancelled'})}).then(refresh).catch(x=>toast(x.message,true));else req('/jobs/'+encodeURIComponent(id)+'/review',{method:'POST',body:JSON.stringify({decision:a,item_ids:[]})}).then(refresh).catch(x=>toast(x.message,true))};$('refresh').onclick=refresh;$('login').onclick=()=>req('/login/open',{method:'POST',body:'{}'}).then(r=>{if(r.vnc_login_url)window.open(r.vnc_login_url,'_blank');toast(r.message||'登录窗口已启动')}).catch(e=>toast(e.message,true));const d=new Date(),s=new Date(d);s.setDate(d.getDate()-7);$('start').value=s.toISOString().slice(0,10);$('end').value=d.toISOString().slice(0,10);refresh();setInterval(refresh,8000)})();</script></html>
